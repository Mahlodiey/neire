version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neire-postgres
    environment:
      POSTGRES_USER: neire_user
      POSTGRES_PASSWORD: neire_password
      POSTGRES_DB: neire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neire_user -d neire"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
